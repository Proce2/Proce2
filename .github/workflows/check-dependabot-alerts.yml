name: Check Dependabot Alerts

on:
  workflow_dispatch:
    inputs:
      alert_state:
        description: 'Alert state to check (open, dismissed, fixed, or all)'
        required: false
        default: 'open'
        type: choice
        options:
          - open
          - dismissed
          - fixed
          - all
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check Dependabot alerts across repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          ALERT_STATE: ${{ github.event.inputs.alert_state || 'open' }}
        run: |
          python scripts/check_dependabot_alerts.py
